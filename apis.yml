aid: evigence-sensors
name: Evigence Sensors
description: >-
  Evigence Sensors is a freshness-management technology company for the food
  industry, combining low-cost physical sensors with data analytics to monitor
  food quality in real time from production to consumption at the individual
  item level. Its time-temperature indicator technology powers both digital
  (QR-scan) and visual freshness indicators applied to retail units, serving
  food brands, retailers, foodservice operators, cold-chain logistics providers,
  and consumers across the supply chain. Evigence holds 27 granted patents and
  its indicators meet WHO time/temperature monitoring standards. The company was
  surfaced as a portfolio company of Battery Ventures and added to the API
  Evangelist network. As of this enrichment pass Evigence publishes no public
  developer portal, API documentation, SDK, or machine-readable API surface;
  this profile captures its verified public company properties only.
